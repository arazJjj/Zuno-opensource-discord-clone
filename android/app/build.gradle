plugins { id 'com.android.application' }
def zunoUrl = System.getenv("ZUNO_URL") ?: "https://zuno-n6rd.onrender.com"
android {
    namespace 'site.zuno.app'
    compileSdk 34
    defaultConfig {
        applicationId "site.zuno.app"
        minSdk 24
        targetSdk 34
        versionCode((System.getenv("GITHUB_RUN_NUMBER") ?: "1") as int)
        versionName "1.1." + (System.getenv("GITHUB_RUN_NUMBER") ?: "0")
        buildConfigField "String", "ZUNO_URL", "\"${zunoUrl}\""
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
