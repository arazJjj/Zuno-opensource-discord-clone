<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e1f22">
<title>Zuno</title>
<link rel="icon" href="/logo.svg">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<!-- AUTH -->
<div id="auth" class="auth hidden">
  <div class="auth-card">
    <img src="/logo.svg" class="auth-logo" alt="">
    <h1 id="auth-title">Welcome back!</h1>
    <p class="muted" id="auth-sub">We're so excited to see you again!</p>
    <form id="login-form">
      <label>Email or username<input name="login" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary wide">Log In</button>
      <p class="muted small">Need an account? <a href="#" data-auth="register">Register</a></p>
    </form>
    <form id="register-form" class="hidden">
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Display name<input name="display_name" maxlength="32"></label>
      <label>Username<input name="username" required pattern="[a-zA-Z0-9_.]{2,32}" autocomplete="username"></label>
      <label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="btn primary wide">Continue</button>
      <p class="muted small">Already have an account? <a href="#" data-auth="login">Log In</a></p>
    </form>
    <p class="error" id="auth-error"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <nav class="rail" id="rail">
    <button class="rail-btn home" id="home-btn" title="Direct Messages"><img src="/logo.svg" alt="Home"></button>
    <div class="rail-sep"></div>
    <div id="server-list"></div>
    <button class="rail-btn add" id="add-server-btn" title="Add a server">+</button>
    <button class="rail-btn add" id="discover-btn" title="Discover servers">🧭</button>
  </nav>

  <aside class="sidebar" id="sidebar">
    <header class="side-head" id="side-head"></header>
    <div class="side-body" id="side-body"></div>
    <div id="voice-bar" class="voice-bar hidden"></div>
    <footer class="me-bar" id="me-bar"></footer>
  </aside>

  <main class="main" id="main">
    <header class="chat-head" id="chat-head"></header>
    <div class="chat-wrap">
      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
        <div class="typing" id="typing"></div>
        <div class="composer" id="composer">
          <div class="reply-bar hidden" id="reply-bar"></div>
          <div class="upload-preview" id="upload-preview"></div>
          <div class="composer-row">
            <input type="file" id="file-input" multiple hidden><button class="icon-btn" id="plus-btn" title="Upload, poll, sticker">＋</button>
            <textarea id="input" rows="1" placeholder="Message"></textarea>
            <button class="icon-btn" id="gif-btn" title="GIFs">GIF</button>
            <button class="icon-btn" id="emoji-btn" title="Emoji">😊</button>
            <button class="icon-btn send" id="send-btn" title="Send">➤</button>
          </div>
        </div>
      </section>
      <aside class="thread-panel hidden" id="thread-panel"></aside>
      <aside class="members" id="members"></aside>
    </div>
  </main>
</div>

<div id="call-stage" class="call-stage hidden"></div>
<div id="popover" class="popover hidden"></div>
<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/sounds.js"></script>
<script src="/icons.js"></script>
<script src="/app.js"></script>
<script src="/voice.js"></script>
<script src="/extras.js"></script>
</body>
</html>
