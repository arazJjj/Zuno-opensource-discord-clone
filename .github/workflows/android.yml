name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      url:
        description: 'Zuno server address'
        required: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ZUNO_URL: ${{ github.event.inputs.url || vars.ZUNO_URL || 'https://zuno.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Zuno.apk
      - uses: actions/upload-artifact@v4
        with: { name: Zuno-apk, path: Zuno.apk }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Zuno for Android (build ${{ github.run_number }})
          body: "Download Zuno.apk below and open it on your phone. Connects to ${{ env.ZUNO_URL }}"
          files: Zuno.apk
